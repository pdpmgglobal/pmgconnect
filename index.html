<style>
:root{--bg:#f1f5fb;--card:#fff;--tx:#1d2330;--mut:#6b7385;--bd:#e2e5ea;--pri:#1d4ed8;--pri2:#e7eefc;--neg:#b3392f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171c;--card:#1d222a;--tx:#e8ebf0;--mut:#9aa3b2;--bd:#303743;--pri:#7aa7ff;--pri2:#1a2a4d;--neg:#ef8a80}}
:root[data-theme="dark"]{--bg:#14171c;--card:#1d222a;--tx:#e8ebf0;--mut:#9aa3b2;--bd:#303743;--pri:#7aa7ff;--pri2:#1a2a4d;--neg:#ef8a80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Thai","Sarabun",system-ui,sans-serif;font-size:15px}
h1{font-size:20px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.kpi small{color:var(--mut)}.kpi b{display:block;font-size:20px;margin-top:2px}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;align-items:end}
label{font-size:12px;color:var(--mut);display:block}
input,select{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.add{background:var(--pri);color:#fff;border:0;padding:9px;border-radius:8px;font:inherit;cursor:pointer}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:480px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);font-size:14px}
th{color:var(--mut);font-weight:500}
.x{background:none;border:0;color:var(--neg);cursor:pointer;font-size:16px}
.neg{color:var(--neg)}
.bars{display:flex;align-items:flex-end;gap:10px;height:120px;margin-top:8px}
.bc{flex:1;text-align:center;font-size:11px;color:var(--mut)}
.bp{display:flex;align-items:flex-end;justify-content:center;gap:3px;height:96px}
.bp i{display:block;width:40%;background:var(--pri);border-radius:3px 3px 0 0;min-height:1px}
.bp i+i{background:#d98a2b}
.leg{font-size:12px;color:var(--mut)}
h2{font-size:16px;margin:0 0 10px}
.empty{color:var(--mut);padding:10px 0}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
:root{--sh:0 2px 12px rgba(18,40,90,.09);--g1:#12306f;--g2:#2563eb}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--sh:0 4px 16px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--sh:0 4px 16px rgba(0,0,0,.4)}
body{font-family:"Noto Sans Thai","Sarabun",system-ui,sans-serif;line-height:1.5;background:var(--bg)}
.card{border-radius:16px;box-shadow:var(--sh);padding:18px;border-color:transparent}
h2{font-size:17px;font-weight:700;padding-left:10px;border-left:4px solid var(--pri);line-height:1.3}
h3{color:var(--pri)}
.kpi{border-radius:14px;box-shadow:var(--sh);border:0;border-left:4px solid var(--pri);padding:12px 14px}
.kpi b{color:var(--pri);font-size:22px;font-weight:700}
.kpi small{font-size:12.5px}
input,select,textarea{border-radius:10px;border:1px solid var(--bd);padding:9px 10px;transition:.15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri2)}
label{font-weight:500;margin-bottom:3px}
.add{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-radius:10px;font-weight:600;box-shadow:0 2px 8px rgba(18,48,111,.28);transition:.15s;padding:10px 14px}
.add:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(18,48,111,.35)}
.tw{border:1px solid var(--bd);border-radius:12px}
table{border-collapse:separate;border-spacing:0}
th{background:var(--pri2);color:var(--pri);font-weight:600;white-space:nowrap;position:sticky;top:0}
th:first-child{border-top-left-radius:11px}th:last-child{border-top-right-radius:11px}
tr:nth-child(even) td{background:rgba(127,127,127,.045)}
tr:hover td{background:var(--pri2)}
tr.sub td{background:var(--pri2)!important;font-weight:700;color:var(--pri)}
tr.grand td{background:var(--pri)!important;color:#fff}
.x{border-radius:8px;padding:3px 8px;transition:.15s}.x:hover{background:rgba(127,127,127,.15)}
.empty{text-align:center;padding:22px;border:1px dashed var(--bd);border-radius:12px}
.bp i{border-radius:4px 4px 0 0}
details{background:var(--bg);border-radius:10px;padding:6px 10px}
.mdl{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:99;padding:16px}.mbx{background:var(--card);color:var(--tx);border-radius:16px;padding:20px;max-width:460px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.35);max-height:90vh;overflow:auto}.mgr{display:grid;gap:10px;margin:12px 0}.mbt{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:14px}.mbt .add{width:auto}
.wlc{max-width:820px;margin:16px auto;border-radius:24px;overflow:hidden;box-shadow:0 12px 40px rgba(18,48,111,.22);background:var(--card)}
.wlc .hero{background:linear-gradient(135deg,#12306f 0%,#2563eb 100%);color:#fff;padding:38px 24px 34px;text-align:center;position:relative}
.wlc .hero img{height:92px;background:#fff;border-radius:18px;padding:8px;box-shadow:0 6px 18px rgba(0,0,0,.28)}
.wlc .hero .t1{font-size:15px;opacity:.92;margin-top:16px;letter-spacing:.5px}
.wlc .hero h1{color:#fff;font-size:30px;margin:4px 0 2px;line-height:1.25}
.wlc .hero .t2{opacity:.85;font-size:13.5px}
.wlc .bd{padding:22px 24px 26px}
.wlc .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0 4px}
.wlc .chips span{background:var(--pri2);color:var(--pri);padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600}
.wlc .lgbtn{width:100%;font-size:17px;padding:14px;margin-top:6px}
@media(max-width:600px){.wlc .hero h1{font-size:23px}.wlc .bd{padding:16px}}
@media print{header,main,nav,aside{display:none!important}body{background:#fff}.mdl{position:static;background:none;padding:0}.mbx{box-shadow:none;max-width:none;padding:0}.mbt{display:none}}
@media(max-width:600px){.card{padding:14px}.kpi b{font-size:19px}}
</style>
<style>
/* ===== PMG shell v2: sidebar layout + dashboard home ===== */
:root{--hd:#12306f;--ok:#15803d}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--hd:#e8ebf0;--ok:#4ade80}}
:root[data-theme="dark"]{--hd:#e8ebf0;--ok:#4ade80}
body{display:flex;min-height:100vh}
body.lg #side,body.lg #shell>header{display:none}
#side{width:252px;flex:none;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;display:flex;flex-direction:column;padding:20px 12px 14px;background:linear-gradient(180deg,#0f2d6e 0%,#0b2259 55%,#071640 100%);color:#fff;z-index:6}
.brand{text-align:center;padding:0 4px 12px}
.brand .lgc{display:inline-block;background:#fff;border-radius:18px;padding:8px 14px;box-shadow:0 6px 18px rgba(0,0,0,.32)}
.brand img{display:block;height:108px;width:auto}
.brand b{display:block;margin-top:12px;font-size:12.5px;letter-spacing:.4px}
#side nav{display:flex;flex-direction:column;gap:4px;padding:10px 0;overflow:visible}
#side nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:transparent;color:#dbe6ff;padding:11px 14px;border-radius:10px;font:inherit;font-weight:500;cursor:pointer;line-height:1.3;transition:.15s}
#side nav button svg,#lgo svg{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#side nav button:hover{background:rgba(255,255,255,.10)}
#side nav button.on{background:#2563eb;color:#fff;font-weight:700;box-shadow:0 4px 12px rgba(37,99,235,.45)}
.sbot{margin-top:auto;border-top:1px solid rgba(255,255,255,.18);padding-top:10px}
#lgo{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:#dbe6ff;padding:11px 14px;border-radius:10px;font:inherit;cursor:pointer}
#lgo:hover{background:rgba(255,255,255,.10)}
#shell{flex:1;min-width:0}
#shell>header{position:sticky;top:0;z-index:5;max-width:none;margin:0;padding:12px 24px;background:var(--card);color:var(--tx);box-shadow:0 1px 0 var(--bd),0 4px 14px rgba(18,40,90,.06);display:flex;align-items:center;justify-content:space-between;gap:12px}
.tt{border-left:3px solid var(--bd);padding-left:14px;min-width:0}
.tt b{display:block;font-size:20px;line-height:1.25;color:var(--hd)}
.tt small{display:block;color:var(--mut);font-weight:600;letter-spacing:.4px}
.tr{display:flex;align-items:center;gap:14px;flex:none}
.bellb{position:relative;width:42px;height:42px;border-radius:50%;border:0;background:transparent;color:var(--hd);cursor:pointer;display:grid;place-items:center}
.bellb:hover{background:var(--pri2)}
.bellb svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.bdg{position:absolute;top:2px;right:1px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:#ef4444;color:#fff;font:700 11px/18px "Noto Sans Thai",system-ui,sans-serif;font-style:normal;text-align:center}
.uc{display:flex;align-items:center;gap:10px;padding-left:14px;border-left:1px solid var(--bd)}
.uav{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#12306f,#2563eb);color:#fff;display:grid;place-items:center;font-weight:700;font-size:16px}
.ui b{display:block;font-size:13.5px;line-height:1.3}
.ui small{display:block;color:var(--mut);font-size:12.5px}
#shell main{max-width:1280px;margin:0 auto;padding:18px 20px 56px}

.bt{position:relative;z-index:1;padding:26px 32px;max-width:680px}
.b0{font-size:19px;font-weight:700;color:#1b2a4a}
.b1{font-size:30px;font-weight:800;color:#12306f;line-height:1.25;margin:2px 0 8px}
.b2{font-size:16px;font-weight:500;color:#1b2a4a}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .bn{background:linear-gradient(100deg,#101a30,#17294d 40%,#1f3f73)}:root:not([data-theme="light"]) .b0,:root:not([data-theme="light"]) .b2{color:#dbe6ff}:root:not([data-theme="light"]) .b1{color:#fff}}
:root[data-theme="dark"] .bn{background:linear-gradient(100deg,#101a30,#17294d 40%,#1f3f73)}:root[data-theme="dark"] .b0,:root[data-theme="dark"] .b2{color:#dbe6ff}:root[data-theme="dark"] .b1{color:#fff}
.kg{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:16px;margin-bottom:16px}
.kc{background:var(--card);border-radius:14px;box-shadow:var(--sh);padding:16px;display:flex;gap:14px;align-items:center;min-width:0}
.kc .ci{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;flex:none}
.kc .ci svg{width:27px;height:27px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.kc small{display:block;color:var(--mut);font-size:13px}
.kc b{display:block;font-size:26px;line-height:1.25;word-break:break-word}
.kc b i{font-style:normal;font-size:15px;font-weight:600;margin-left:5px}
.kc .tn{font-size:12.5px;color:var(--mut);margin-top:2px}
.tn.up{color:var(--ok)}.tn.dn{color:var(--neg)}
.r3{display:grid;grid-template-columns:minmax(0,2.1fr) minmax(0,1.1fr) minmax(0,.95fr);gap:16px;margin-bottom:16px}
.r2{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:16px;margin-bottom:16px}
.pn{background:var(--card);border-radius:14px;box-shadow:var(--sh);overflow:hidden;min-width:0;display:flex;flex-direction:column;margin-bottom:0}
.r3+.pn,.r2+.pn{margin-top:0}
.ph{background:#12306f;color:#fff;padding:11px 16px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:15.5px}
.ph>svg{width:20px;height:20px;flex:none;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ph .r{margin-left:auto;display:flex;gap:10px;align-items:center;font-weight:500;font-size:12.5px}
.ph .lk{background:none;border:0;color:#fff;font:inherit;cursor:pointer;padding:2px 4px}
.ph .lk:hover{text-decoration:underline}
.ph select{width:auto;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:4px 12px;font-size:13px}
.ph select option{color:#111;background:#fff}
.pb{padding:14px 16px;flex:1;min-width:0}
.lgd{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;font-size:13px;margin-bottom:4px}
.lgd i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.chw{overflow-x:auto}
.chs{display:block;width:100%;min-width:560px;height:auto}
.chs .gl{stroke:var(--bd);stroke-width:1}
.chs text{fill:var(--mut);font-size:11.5px}
.ev{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd);align-items:flex-start}
.ev:first-child{padding-top:0}.ev:last-child{border-bottom:0;padding-bottom:0}
.dbx{width:54px;flex:none;border-radius:10px;text-align:center;padding:6px 0;line-height:1.15}
.dbx b{display:block;font-size:24px}.dbx small{font-size:12px;font-weight:600}
.et{font-weight:600}.es{color:var(--mut);font-size:13px}
.qg{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.qm{border:0;border-radius:12px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font:inherit;font-weight:600;font-size:13px;line-height:1.25;min-height:84px;text-align:center;cursor:pointer;transition:.15s}
.qm:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(18,40,90,.15)}
.qm *{pointer-events:none}
.qm svg{width:27px;height:27px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nw{display:flex;gap:16px;align-items:flex-start}
.nwi{flex:none;width:92px;height:92px;border-radius:14px;background:var(--pri2);display:grid;place-items:center}
.nwi svg{width:50px;height:50px;stroke:var(--pri);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nwt{font-weight:700;margin-bottom:4px}
.nwx{color:var(--mut);white-space:pre-wrap;font-size:14px}
.nwd{font-size:12.5px;color:var(--mut);margin-top:6px}
.nwo{border-top:1px solid var(--bd);margin-top:10px;padding-top:10px}
.sm4{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));padding:14px 8px;flex:1;align-items:center}
.sm4>div{text-align:center;padding:6px 10px}
.sm4>div+div{border-left:1px solid var(--bd)}
.sm4 .sic svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sm4 small{display:block;color:var(--mut);font-size:12.5px;margin:2px 0 4px;min-height:36px}
.sm4 b{font-size:20px;line-height:1.3}
@media(max-width:1180px){.r3{grid-template-columns:1fr 1fr}.r3>:first-child{grid-column:1/-1}}
@media(max-width:860px){
body{display:block}
#side{position:sticky;top:0;width:auto;height:auto;flex-direction:row;align-items:center;gap:6px;padding:8px 10px;overflow:visible;background:linear-gradient(90deg,#0f2d6e,#0a1f55)}
.brand{padding:0;flex:none}.brand .lgc{padding:3px 6px;border-radius:10px}.brand img{height:38px}.brand b{display:none}
#side nav{flex-direction:row;flex:1;min-width:0;overflow-x:auto;padding:0;gap:4px;scrollbar-width:thin}
#side nav button{width:auto;white-space:nowrap;padding:8px 12px;gap:6px;font-size:13.5px}
#side nav button svg{width:18px;height:18px}
.sbot{margin:0;border:0;padding:0;flex:none}
#lgo{padding:8px}#lgo span{display:none}
#shell>header{position:static;padding:10px 14px}
.tt b{font-size:16px}.ui{display:none}.uc{padding-left:10px}
#shell main{padding:14px 12px 48px}
.r2{grid-template-columns:1fr}
.b1{font-size:22px}.b0{font-size:16px}.bt{padding:20px}
.bn::after{width:100%;opacity:.3;-webkit-mask-image:none;mask-image:none}
}
@media(max-width:640px){.r3{grid-template-columns:1fr}.nw{flex-direction:column}.tt small{display:none}}
@media print{body{display:block!important}aside,#shell>header{display:none!important}}
